[project]
name = "cacaoid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "iqbal-rahmatullah", email = "iqbalrahmmatullah01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "rasterio>=1.5.2",
    "scikit-learn>=1.9.1",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cacaoid = "cacaoid:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
